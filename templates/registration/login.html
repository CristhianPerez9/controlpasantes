<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - COMTECO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-red-600 tracking-tight">COMTECO</h1>
            <p class="text-sm text-gray-500 mt-1">Control de Asistencia de Pasantes</p>
        </div>

        <h2 class="text-lg font-semibold text-gray-800 mb-4 text-center">Ingreso al Sistema</h2>

        {% if form.errors %}
            <div class="p-3 mb-4 text-sm text-red-700 bg-red-100 rounded-lg font-medium">
                Usuario o contraseña incorrectos. Por favor, intente de nuevo.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1" governors for="id_username">Usuario</label>
                <input type="text" name="username" id="id_username" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition-all">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1" for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition-all">
            </div>

            <button type="submit" 
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-sm active:scale-[0.99]">
                Entrar
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-400">Sistema de Gestión Interna — Sincronizado</p>
        </div>
    </div>

</body>
</html>
