{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Sistema - COMTECO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f4f5f6] min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 shadow-xl flex flex-col justify-between">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-[#cc0000] tracking-tight">COMTECO</h1>
            <p class="text-xs font-semibold text-slate-500 mt-1">Control de Asistencia de Pasantes</p>
            <h2 class="text-lg font-bold text-slate-800 mt-4">Ingreso al Sistema</h2>
        </div>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="rounded-xl p-3.5 shadow-sm text-xs font-semibold flex items-center gap-2 bg-red-50 text-red-800 border border-red-200">
                <i class="fa-solid fa-circle-exclamation text-red-500 text-sm"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="flex flex-col gap-4">
            {% csrf_token %}

            <div>
                <label for="username" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user text-xs"></i>
                    </span>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-sm font-semibold text-slate-800 outline-none focus:border-[#cc0000] focus:bg-white transition-all"
                           placeholder="Ej: cperez">
                </div>
            </div>

            <div>
                <label for="password" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-sm font-semibold text-slate-800 outline-none focus:border-[#cc0000] focus:bg-white transition-all"
                           placeholder="••••••••••••">
                </div>
            </div>

            <button type="submit" class="w-full bg-[#cc0000] hover:bg-red-800 text-white font-bold py-3.5 rounded-xl shadow-md active:scale-[0.98] transition-all text-sm mt-2 flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar
            </button>
        </form>

        <div class="text-center border-t border-slate-100 pt-4 mt-6">
            <p class="text-[10px] text-slate-400 font-medium tracking-wide">
                Sistema de Gestión Interna — Sincronizado Active Directory
            </p>
        </div>
    </div>

</body>
</html>
