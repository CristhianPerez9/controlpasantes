{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Sistema - COMTECO Pasantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f4f5f6] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8 md:p-10 w-full max-w-md">
        
        <div class="flex flex-col items-center text-center mb-8">
            <div class="flex items-center justify-center gap-3 mb-2">
                <img src="{% static 'logo.png' %}" alt="Logo COMTECO" class="h-10 md:h-12 w-auto object-contain">
                <h1 class="text-3xl font-black tracking-tight text-[#cc0000]">COMTECO</h1>
            </div>
            <p class="text-[11px] font-bold text-slate-500 tracking-wide uppercase mt-1">Control de Asistencia de Pasantes</p>
            
            <h2 class="text-lg font-bold text-slate-800 mt-5"><i class="fa-solid fa-lock text-slate-400 mr-2"></i>Ingreso al Sistema</h2>
        </div>

        <form method="POST" action="{% url 'login' %}" class="flex flex-col gap-5">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="bg-red-50 border border-red-200 text-[#cc0000] text-xs font-bold p-3 rounded-xl text-center">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> Usuario o contraseña incorrectos.
                </div>
            {% endif %}

            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Usuario</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-slate-300 text-sm"></i>
                    </div>
                    <input type="text" name="username" placeholder="Ej: cperez" required autofocus
                           class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 outline-none focus:border-slate-400 focus:bg-white transition-colors font-medium text-slate-700"/>
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-300 text-sm"></i>
                    </div>
                    <input type="password" name="password" placeholder="•••••••••••" required 
                           class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 outline-none focus:border-slate-400 focus:bg-white transition-colors font-medium text-slate-700"/>
                </div>
            </div>

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit" class="w-full bg-[#cc0000] hover:bg-red-800 text-white font-bold text-sm py-3.5 rounded-xl shadow-md transition-colors mt-2 flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">
                Sistema de Gestión Interna — Sincronizado Active Directory
            </p>
        </div>
    </div>

</body>
</html>
