{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen select-none">
    
    <div class="bg-white p-8 rounded-3xl shadow-lg w-full max-w-md border border-gray-100">
        
        <div class="flex items-center justify-center gap-4 mb-4">
            <img src="{% static 'logo.png' %}" alt="Logo COMTECO" class="h-12 w-12 object-contain">
            <div class="text-left">
                <h1 class="text-2xl font-bold text-gray-950 tracking-tight">COMTECO</h1>
                <p class="text-xs font-medium text-gray-500">Control de Asistencia de Pasantes</p>
            </div>
        </div>

        <div class="text-center mb-4">
            <h2 class="text-xl font-semibold text-gray-700">Ingreso de Asistencia</h2>
            
            <div class="mt-4 p-3 bg-gray-50 border border-gray-200 rounded-2xl shadow-inner">
                <div class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Hora Oficial</div>
                <div id="reloj-digital" class="text-3xl font-black text-gray-800 font-mono tracking-wider">00:00:00</div>
            </div>
        </div>

        {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    <div class="p-3 rounded-lg text-sm text-center {% if message.tags == 'success' %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form id="attendance-form" method="POST" action="{% url 'registrar_asistencia' %}">
            {% csrf_token %}
            <div class="mb-4">
                <input type="text" id="ci_display" name="ci_value" readonly 
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-center text-xl font-semibold text-gray-700 focus:outline-none focus:ring-2 focus:ring-red-500" 
                       placeholder="CI: 7654321">
                <input type="hidden" id="tipo_marca" name="tipo_marca" value="ENTRADA">
            </div>

            <div class="grid grid-cols-3 gap-2 mb-6">
                <button type="button" onclick="pressNum('1')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200">1</button>
                <button type="button" onclick="pressNum('2')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200">2</button>
                <button type="button" onclick="pressNum('3')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200">3</button>
                <button type="button" onclick="pressNum('4')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200">4</button>
                <button type="button" onclick="pressNum('5')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200">5</button>
                <button type="button" onclick="pressNum('6')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200">6</button>
                <button type="button" onclick="pressNum('7')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200">7</button>
                <button type="button" onclick="pressNum('8')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200">8</button>
                <button type="button" onclick="pressNum('9')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200">9</button>
                <button type="button" onclick="clearDisplay()" class="bg-[#e4a824] hover:bg-yellow-600 text-white font-semibold py-3 rounded-lg text-sm transition duration-200">BORRAR</button>
                <button type="button" onclick="pressNum('0')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200">0</button>
                <button type="button" onclick="backspaceDisplay()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 font-semibold py-3 rounded-lg text-lg transition duration-200"><i class="fa-solid fa-delete-left"></i></button>
            </div>

            <div align="center">
                <!-- <button type="button" onclick="submitAttendance('ENTRADA')" class="w-1/2 bg-[#239b56] hover:bg-green-700 text-white font-bold py-3 rounded-lg transition duration-200 uppercase tracking-wider text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entrada</button> -->
                <button type="button" onclick="submitAttendance('ENTRADA')" class="w-1/2 bg-[#239b56] hover:bg-green-700 text-white font-bold py-3 rounded-lg transition duration-200 uppercase tracking-wider text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-arrow-right-to-bracket"></i> MARCAR</button>
                <!-- <button type="button" onclick="submitAttendance('SALIDA')" class="w-1/2 bg-[#cc2424] hover:bg-red-800 text-white font-bold py-3 rounded-lg transition duration-200 uppercase tracking-wider text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-arrow-right-from-bracket"></i> Salida</button> -->
            </div>
        </form>
        <div class="mt-6 text-center text-xs font-medium text-gray-500">
            <a href="{% url 'index_dashboard' %}" class="text-blue-500 hover:text-blue-700">Supervisor</a>
        </div>
    </div>

    <script>
        const display = document.getElementById('ci_display');
        const form = document.getElementById('attendance-form');
        const tipoMarcaInput = document.getElementById('tipo_marca');

        // Lógica del Reloj Digital
        function actualizarReloj() {
            const ahora = new Date();
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const segundos = String(ahora.getSeconds()).padStart(2, '0');
            document.getElementById('reloj-digital').textContent = `${horas}:${minutos}:${segundos}`;
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // Control por Mouse
        function pressNum(num) {
            if (display.value.length < 15) {
                display.value += num;
            }
        }

        function clearDisplay() {
            display.value = '';
        }

        function backspaceDisplay() {
            display.value = display.value.slice(0, -1);
        }

        function submitAttendance(tipo) {
            if (display.value.trim() === "") {
                alert("Por favor, ingrese un número de carnet.");
                return;
            }
            tipoMarcaInput.value = tipo;
            form.submit();
        }

        // Control por Teclado Físico
        document.addEventListener('keydown', function(event) {
            if (event.key >= '0' && event.key <= '9') {
                pressNum(event.key);
            } else if (event.key === 'Backspace') {
                backspaceDisplay();
            } else if (event.key === 'Delete') {
                clearDisplay();
            } else if (event.key === 'Enter') {
                event.preventDefault();
                submitAttendance('ENTRADA');
            }
        });
    </script>
</body>
</html>
